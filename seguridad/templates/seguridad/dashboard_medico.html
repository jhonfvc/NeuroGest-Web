<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div class="bg-white p-5 rounded-xl shadow-sm">
        <p class="font-semibold text-indigo-700">Agenda del día</p>
        <p class="text-sm text-slate-500 mt-1">Pacientes en espera (HU-09 / HU-12).</p>

    </div>
