{% extends 'seguridad/_tarjeta.html' %}
{% block titulo %}Iniciar Sesión{% endblock %}
{% block contenido %}
<form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
        <label for="username" class="block text-sm font-medium text-slate-700">Usuario</label>
        <input type="text" id="username" name="username" required autofocus class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
        <input type="password" id="password" name="password" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition duration-200">
        Ingresar al Sistema
    </button>
</form>
<p class="text-center text-sm mt-4">
    <a href="{% url 'password_reset' %}" class="text-indigo-600 hover:underline">¿Olvidaste tu contraseña?</a>
</p>
{% endblock %}
